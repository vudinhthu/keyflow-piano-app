name: Piano browser E2E

on:
  push:
    branches: [main, 'task/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: piano-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chrome:
    name: Chrome full controls, persistent offline and safe updates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: false
      - name: Set up project Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chrome and required system libraries
        run: pnpm exec playwright-cli install-browser chrome --with-deps
      - name: Complete automated Chrome journey
        run: pnpm test:mvp
      - name: Keep current reports and screenshots even on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chrome-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            output/playwright/*.json
            output/playwright/*.png
            output/playwright/*.txt
          if-no-files-found: warn
          retention-days: 14
